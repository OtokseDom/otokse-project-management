# Project Management — project.otokse.com
# ---------------------------------------------------------------------------
# DEPLOY (on VPS, user runs sudo steps):
#   1. cp this file to /var/www/ecommerce/nginx/conf.d/project.otokse.com.conf
#   2. Apply the ecommerce-compose snippet at the bottom of this file, then in
#      /var/www/ecommerce:  docker compose up -d nginx
#   3. HTTP-01 cert (user runs, needs sudo):
#      sudo certbot certonly --webroot \
#        --webroot-path /var/www/ecommerce/nginx/certbot/www \
#        -d project.otokse.com
#   4. Reload: docker exec ecommerce-nginx-1 nginx -s reload
#      (first deploy: cert files must exist before the :443 block loads —
#      deploy the :80 block + certbot first, then add :443 and reload.)
# ---------------------------------------------------------------------------
# Pattern matches existing conf.d files: resolver 127.0.0.11 (Docker DNS) +
# variables for upstreams so redeploys re-resolve without nginx restarts.

# HTTP — ACME challenge + redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name project.otokse.com;

    resolver 127.0.0.11 valid=10s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — SPA static + Laravel API
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name project.otokse.com;

    resolver 127.0.0.11 valid=10s;

    # Separate cert for this subdomain (independent renewal).
    ssl_certificate /etc/letsencrypt/live/project.otokse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/project.otokse.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 12M;

    # SPA static build (populated by the project's frontend-build service).
    root /usr/share/project/html;
    index index.html;

    # API → Laravel php-fpm in project_backend (FastCGI, internal :9000).
    location /api/ {
        set $project_backend project_backend:9000;
        fastcgi_pass $project_backend;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Attachments (local disk, persisted in project_storage volume).
    location /storage/ {
        alias /var/www/project-storage/;
        access_log off;
        expires 7d;
        try_files $uri =404;
    }

    # SPA fallback (same-origin /api thanks to VITE_API_BASE_URL empty build).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/project_access.log;
    error_log /var/log/nginx/project_error.log;
}

# ---------------------------------------------------------------------------
# ECOMMERCE COMPOSE SNIPPET (/var/www/ecommerce/docker-compose.yml) — the only
# change to the ecommerce stack. Keeps repo parity via external-network/volume
# pattern (compose warns, doesn't fail, if project_* don't exist yet locally):
#
#   services:
#     nginx:
#       volumes:
#         - ./nginx/conf.d:/etc/nginx/conf.d:ro
#         - /etc/letsencrypt:/etc/letsencrypt:ro
#         - ./nginx/certbot/www:/var/www/certbot:ro
#         - storage:/var/www/html/storage/app/public:ro
#         - project_frontend_dist:/usr/share/project/html:ro      # ADD
#         - project_storage:/var/www/project-storage:ro           # ADD
#       networks:
#         - ecommerce                                            # existing
#         - project_network                                      # ADD
#
#   volumes:
#     pgdata:
#     storage:
#     vendor:
#     project_frontend_dist:                                     # ADD
#       external: true
#     project_storage:                                           # ADD
#       external: true
#
#   networks:
#     ecommerce:                                                 # existing, keep shape
#     project_network:                                           # ADD
#       external: true
# ---------------------------------------------------------------------------
